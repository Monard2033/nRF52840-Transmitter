# Transmitter: SPI slave from RP2040 and ESB PTX to the dongle.
# Release build: no UART/USB CDC logging.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

# ESB radio link
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_PIPE_COUNT=8
CONFIG_ESB_RADIO_IRQ_PRIORITY=0

# SPI slave
CONFIG_SPI=y

# Existing board peripherals
CONFIG_PWM=y
CONFIG_GPIO=y

# Platform
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_SYSTEM_CLOCK_WAIT_FOR_STABILITY=y
CONFIG_PINCTRL=y
CONFIG_FLASH=y
