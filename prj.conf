# Transmitter: SPI slave from RP2040 and ESB PTX to the dongle.
# USB CDC ACM is used as a debug serial console.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y

# ESB radio link
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_PIPE_COUNT=8
CONFIG_ESB_RADIO_IRQ_PRIORITY=0

# SPI slave
CONFIG_SPI=y

# Existing board peripherals
CONFIG_PWM=y
CONFIG_GPIO=y

# Platform
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_SYSTEM_CLOCK_WAIT_FOR_STABILITY=y
CONFIG_PINCTRL=y
CONFIG_FLASH=y

# Legacy USB CDC ACM debug serial. This is the same stable USB stack used by
# the Receiver and avoids the device-next 4095-byte control-buffer issue.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_MANUFACTURER="Monard"
CONFIG_USB_DEVICE_PRODUCT="Keyboard Transmitter Debug"
CONFIG_USB_DEVICE_VID=0x1B4F
CONFIG_USB_DEVICE_PID=0x0003
